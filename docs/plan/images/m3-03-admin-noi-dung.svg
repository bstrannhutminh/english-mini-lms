<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">NC2 — Đăng &amp; sửa bài ngay trong app (không cần sửa file, không cần seed)</text>

  <defs>
    <marker id="m3arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b8c"/>
    </marker>
  </defs>

  <!-- Before: old way (dimmed, struck) -->
  <text x="180" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#9ca3af">CÁCH CŨ — mất thời gian</text>
  <rect x="40" y="95" width="90" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="85" y="115" text-anchor="middle" font-size="10" fill="#6b7280">Sửa file</text>
  <text x="85" y="130" text-anchor="middle" font-size="10" fill="#6b7280">YAML</text>
  <line x1="132" y1="118" x2="152" y2="118" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="154" y="95" width="90" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="199" y="115" text-anchor="middle" font-size="10" fill="#6b7280">Nhờ agent</text>
  <text x="199" y="130" text-anchor="middle" font-size="10" fill="#6b7280">chạy seed</text>
  <line x1="246" y1="118" x2="266" y2="118" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="268" y="95" width="90" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="313" y="115" text-anchor="middle" font-size="10" fill="#6b7280">Chờ xong</text>
  <text x="313" y="130" text-anchor="middle" font-size="10" fill="#6b7280">mới thấy bài</text>
  <line x1="40" y1="160" x2="358" y2="160" stroke="#e05a5a" stroke-width="2.5"/>
  <text x="199" y="178" text-anchor="middle" font-size="10.5" fill="#e05a5a" font-weight="600">✕ Bỏ hẳn cách này</text>

  <!-- New way -->
  <text x="620" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#237a3c">CÁCH MỚI — tự làm trong app</text>
  <rect x="420" y="95" width="400" height="80" rx="12" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="620" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#237a3c">Trang Quản trị → mục "📚 Nội dung học"</text>
  <text x="620" y="146" text-anchor="middle" font-size="11.5" fill="#1a1a2e">Tạo bài mới / sửa đề, transcript, câu hỏi, link video / gán chủ đề</text>
  <text x="620" y="164" text-anchor="middle" font-size="11.5" fill="#1a1a2e">Bấm "Đã duyệt" → bài hiện ngay trong Thư viện</text>

  <!-- Down arrow -->
  <line x1="620" y1="180" x2="620" y2="215" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr3)"/>

  <!-- DB -->
  <rect x="490" y="220" width="260" height="60" rx="12" fill="#eaf0fb" stroke="#2f80ed" stroke-width="2"/>
  <text x="620" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1a5fb4">Database (Supabase)</text>
  <text x="620" y="265" text-anchor="middle" font-size="11" fill="#4a4a68">bài học · nguồn · đoạn trích · câu hỏi</text>

  <!-- Up flow left: library -->
  <line x1="480" y1="250" x2="300" y2="250" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr3)"/>
  <rect x="40" y="220" width="260" height="60" rx="12" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="170" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#b26a00">Thư viện (người học thấy)</text>
  <text x="170" y="265" text-anchor="middle" font-size="11" fill="#4a4a68">chỉ hiện bài "Đã duyệt"</text>

  <!-- Guard rail -->
  <rect x="40" y="310" width="780" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="430" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">An toàn sẵn có (đã chốt trong prompt)</text>
  <text x="430" y="358" text-anchor="middle" font-size="11" fill="#4a4a68">Chỉ tài khoản admin vào được · Không có nút xoá — chỉ "Lưu trữ" (bài ẩn khỏi thư viện nhưng lịch sử học còn)</text>
  <text x="430" y="378" text-anchor="middle" font-size="11" fill="#4a4a68">Câu hỏi bài nghe được kiểm đúng chuẩn trước khi lưu — sai format báo lỗi ngay, không vỡ màn học</text>
</svg>
