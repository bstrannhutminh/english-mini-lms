<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">NC5 — Luồng học mỗi ngày sau khi vá: một vòng khép kín</text>

  <defs>
    <marker id="m3arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b8c"/>
    </marker>
  </defs>

  <!-- Step 1: Today -->
  <rect x="330" y="70" width="200" height="64" rx="12" fill="#eaf0fb" stroke="#2f80ed" stroke-width="2"/>
  <text x="430" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a5fb4">1. Hôm nay</text>
  <text x="430" y="118" text-anchor="middle" font-size="10.5" fill="#4a4a68">streak 🔥 · phiên đang dở · bài gợi ý</text>

  <!-- arrow down-right -->
  <line x1="530" y1="120" x2="620" y2="160" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr6)"/>

  <!-- Step 2: vocab -->
  <rect x="620" y="160" width="200" height="64" rx="12" fill="#fdf3e3" stroke="#e6a23c" stroke-width="2"/>
  <text x="720" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b26a00">2. Ôn từ đến hạn</text>
  <text x="720" y="208" text-anchor="middle" font-size="10.5" fill="#4a4a68">quẹt thẻ nhanh hoặc thử thách</text>

  <!-- arrow down -->
  <line x1="720" y1="228" x2="720" y2="276" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr6)"/>

  <!-- Step 3: do exercise -->
  <rect x="620" y="280" width="200" height="64" rx="12" fill="#eaf7ec" stroke="#3aa757" stroke-width="2"/>
  <text x="720" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="#237a3c">3. Làm bài</text>
  <text x="720" y="328" text-anchor="middle" font-size="10.5" fill="#4a4a68">viết / đọc–dịch / nói / nghe</text>

  <!-- arrow left -->
  <line x1="616" y1="312" x2="544" y2="312" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr6)"/>

  <!-- Step 4: feedback -->
  <rect x="330" y="280" width="210" height="64" rx="12" fill="#f1ecfb" stroke="#7b5cd6" stroke-width="2"/>
  <text x="435" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5b3fae">4. Xem feedback AI</text>
  <text x="435" y="328" text-anchor="middle" font-size="10.5" fill="#4a4a68">sửa bài → nộp bản 2</text>

  <!-- arrow up-left -->
  <line x1="326" y1="312" x2="240" y2="312" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr6)"/>

  <!-- Step 5: my work -->
  <rect x="40" y="280" width="196" height="64" rx="12" fill="#fdeaea" stroke="#e05a5a" stroke-width="2"/>
  <text x="138" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b03a3a">5. Bài của tôi</text>
  <text x="138" y="328" text-anchor="middle" font-size="10.5" fill="#4a4a68">mọi bài đã nộp + feedback, tra lại</text>

  <!-- arrow back to today -->
  <path d="M 138 276 L 138 160 Q 138 102 326 102" fill="none" stroke="#5b6b8c" stroke-width="2.5" marker-end="url(#m3arr6)"/>
  <text x="90" y="200" text-anchor="middle" font-size="11" fill="#4a4a68" transform="rotate(-90 90 200)">ngày mai quay lại →</text>

  <!-- Before note -->
  <rect x="560" y="70" width="260" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="690" y="94" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a2e">Trước đây bị gãy ở đâu?</text>
  <text x="690" y="114" text-anchor="middle" font-size="10.5" fill="#6b7280">menu "Học" là ngõ cụt · bài nộp xong</text>
  <text x="690" y="128" text-anchor="middle" font-size="10.5" fill="#6b7280">"biến mất" — không chỗ tra lại</text>
</svg>
