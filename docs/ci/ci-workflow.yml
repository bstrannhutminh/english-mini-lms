# ⚠️ FILE NÀY KHÔNG CÒN LÀ BẢN NHÁP — workflow thật đã nằm ở:
#     .github/workflows/ci.yml   (kể từ batch F, 25/11/2026)
#
# Lý do trước đây phải giữ bản nháp ngoài .github/: OAuth token của lead
# thiếu scope "workflow" nên GitHub từ chối push chứa file workflow. Nếu push
# bị lỗi "refusing to allow an OAuth App to create or update workflow",
# cần tạo PAT có scope `workflow` hoặc dùng GitHub CLI (`gh auth login`
# với scope workflow) rồi push lại.
#
# Nội dung workflow thật (xem file .github yml để biết bản mới nhất):
#   - trigger: push/PR vào master
#   - Node 24, npm ci → lint → typecheck → unit tests (hermetic) → build
#   - không cần secret nào (build xác minh chạy không env)
#   - integration job giữ dạng template comment (opt-in khi có
#     TEST_DATABASE_URL làm repository secret)
#
# File này chỉ còn vai trò ghi chú lịch sử — KHÔNG copy ngược vào .github
# nữa, sửa workflow hãy sửa trực tiếp .github/workflows/ci.yml.
